name: DroneCAN

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  libraries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Raw native assertion/semaphore options are compile checked. Linking
      # those low-level options requires hooks supplied by their consumer.
      - run: cargo check --workspace --all-features --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: cargo test --workspace --locked
      - run: cargo test -p dronecan-core --all-features --locked

  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The Cargo Git consumer fetches this local repository by commit.
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
      - run: python3 tools/check_release.py --git-rev HEAD --target thumbv6m-none-eabi
      - run: cargo publish --workspace --dry-run --locked

  protocol:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features:
          - vendored
          - vendored,tao-option
          - vendored,deadline
          - vendored,multi-iface
          - vendored,canfd
          - vendored,canfd,deadline,multi-iface,tao-option
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: cargo test -p dronecan-core --locked --no-default-features --features '${{ matrix.features }}'

  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features:
          - vendored
          - vendored,tao-option
          - vendored,deadline
          - vendored,multi-iface
          - vendored,canfd
          - vendored,canfd,deadline,multi-iface,tao-option,dsdl-dronecan,dsdl-ardupilot,dsdl-com,dsdl-cuav,dsdl-mppt
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
      - run: cargo fmt --all -- --check
        working-directory: bin/stm32g0b1
      # Bare-metal binaries have no std test harness; do not use --all-targets.
      - run: cargo clippy --locked --no-default-features --features '${{ matrix.features }}' -- -D warnings
        working-directory: bin/stm32g0b1
      - run: cargo build --release --locked --no-default-features --features '${{ matrix.features }}'
        working-directory: bin/stm32g0b1

  dsdl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: python -m pip install -r requirements.txt
      - run: python tools/generate_dsdl.py --check
      - run: python3 tools/check_release.py --source-generation
        env:
          DRONECAN_DSDLC_PYTHON: python
      - run: cargo test -p dronecan-core --no-default-features --locked
        env:
          DRONECAN_DSDLC_PYTHON: python
